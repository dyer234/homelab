services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=dashboard.${DOMAIN}
      # Homepage only exposes HOMEPAGE_VAR_* to its config files, as
      # {{HOMEPAGE_VAR_X}}. Values come from 1pass.env via `op run`.
      - HOMEPAGE_VAR_DOMAIN=${DOMAIN}
      - HOMEPAGE_VAR_JENKINS_USER=${JENKINS_API_USER}
      - HOMEPAGE_VAR_JENKINS_TOKEN=${JENKINS_API_TOKEN}
      - HOMEPAGE_VAR_WG_HOST=${WG_HOST}
      - HOMEPAGE_VAR_WGEASY_PASSWORD=${WGEASY_PASSWORD}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`dashboard.${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
      # Ensure proper HTTPS headers to prevent mixed content warnings
      - "traefik.http.routers.homepage.middlewares=homepage-headers"
      - "traefik.http.middlewares.homepage-headers.headers.sslProxyHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.homepage-headers.headers.stsSeconds=315360000"
      - "traefik.http.middlewares.homepage-headers.headers.stsIncludeSubdomains=true"
    networks:
      - traefik-public
    restart: unless-stopped

networks:
  traefik-public:
    external: true
