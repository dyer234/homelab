# Overlay for hosts without a public domain (NO_ACME=true in homelab.local.env):
# same Traefik, no Let's Encrypt resolver, so routers fall back to Traefik's
# self-signed default certificate. `command` REPLACES the base list wholesale
# when overlaid, so every non-ACME flag from docker-compose.yml must be
# repeated here — keep the two in step.
services:
  home-traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # TLS for every router on websecure, served from the certificate store
      # by SNI. Routers therefore need no tls/certresolver labels of their own;
      # the one request that fills the store is the wildcard on the dashboard
      # router below (docker-compose.yml). A per-router certresolver label
      # would make Traefik request a separate per-host certificate — don't.
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.redis.address=:6379"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--api.dashboard=true"
