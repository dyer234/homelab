services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    environment:
      - TZ=${TZ}
      # Python `cryptography` >=47 (48 in this image) SIGILLs under the Apple
      # Silicon hypervisor (Docker Desktop): restart loop, exit 132, no log.
      # Skips OpenSSL's ARM feature probe; no-op on x86, harmless on Linux.
      # Same fix as mcp/docker-compose.yml.
      - OPENSSL_armcap=0
    volumes:
      - ./open-webui:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`ai.${DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
      - "homepage.group=AI"
      - "homepage.name=Open WebUI"
      - "homepage.icon=open-webui.png"
      - "homepage.href=https://ai.${DOMAIN}"
      - "homepage.description=AI Chat Interface"
    networks:
      - traefik-public
    restart: unless-stopped

networks:
  traefik-public:
    external: true
