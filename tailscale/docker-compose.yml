# Tailscale subnet router for the homelab's Docker network.
#
# Why this exists alongside Tailscale on the host:
#   - The host install only covers the *host's* published ports, and only while
#     the host daemon is running. This container puts the container network on
#     the tailnet whenever the homelab itself is up.
#   - It is the forward-compatible path. When the homelab moves back to the Linux
#     host, this stack is unchanged — only the host-level Tailscale install goes
#     away. Nothing downstream (ACLs, agent config) has to be rewritten.
#
# It advertises the traefik-public subnet rather than proxying a single service,
# so every container is reachable by its network address. Deliberately NOT using
# `network_mode: service:` — that is the netns trap this repo already hit with
# gluetun/qBittorrent, where recreating the network container leaves the
# dependent container permanently broken.

services:
  tailscale:
    # Pinned deliberately. A floating tag on infrastructure this load-bearing is
    # how home-traefik got broken once already.
    image: tailscale/tailscale:v1.102.3
    container_name: tailscale
    # TS_HOSTNAME and NET_PREFIX come from ../homelab.env (per-host overrides
    # in ../homelab.local.env) so two hosts get distinct nodes and routes.
    hostname: ${TS_HOSTNAME}
    environment:
      # A pre-minted, TAGGED device auth key (tskey-auth-...). The tag is baked
      # into the key at creation, so no --advertise-tags is needed here — and no
      # ?preauthorized=/?ephemeral= query params either. Those are only valid on
      # an OAuth client secret, where Tailscale mints a key on the fly; appended
      # to a real auth key they become part of the key string and invalidate it.
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_STATE_DIR=/var/lib/tailscale
      # Advertise the Docker network so tailnet peers can reach containers
      # directly. The route is auto-approved by an autoApprovers rule keyed on
      # tag:homelab, maintained by hand in the admin console (Access Controls);
      # it should list the supernet 172.16.0.0/12 so any NET_PREFIX qualifies.
      # If it is missing, the route sits unapproved until someone clicks
      # Edit route settings on the machine.
      - TS_ROUTES=${NET_PREFIX}.0.0/16
      # Kernel networking. Userspace mode (the image default) CANNOT act as a
      # subnet router, so this is required, not an optimisation.
      - TS_USERSPACE=false
      # Exposes /healthz on TS_LOCAL_ADDR_PORT; returns 200 once the node has a
      # tailnet IP. Drives the healthcheck below.
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=0.0.0.0:41234
      # Only log in once; without it a restart re-runs `tailscale up` and can
      # trip over an already-consumed single-use key.
      - TS_AUTH_ONCE=true
      # Tag the node explicitly rather than relying on the auth key having been
      # minted with tags. An untagged node is user-owned, and the autoApprovers
      # rule in the admin console keys on tag:homelab — so an untagged router
      # advertises its route and then waits forever for a manual approval that
      # never comes. Declaring it here puts the tag in the repo instead of in
      # however someone happened to generate the key.
      #
      # This MUST match the key's tags if the key has any, or registration is
      # rejected outright. An untagged key is fine: you are a tagOwner for it.
      - TS_EXTRA_ARGS=--advertise-tags=tag:homelab
      # Pin the WireGuard/disco UDP port so it can be published below and
      # port-forwarded on the router. Without this tailscaled picks a random
      # port behind Docker Desktop's symmetric NAT and every remote peer is
      # stuck on DERP. This is a tailscaled flag, NOT a `tailscale up` flag,
      # so it cannot live in TS_EXTRA_ARGS. Not 41641: the host's own
      # Tailscale already owns that.
      - TS_TAILSCALED_EXTRA_ARGS=--port=41642
      # Put the LocalAPI socket on the shared volume below (the image default
      # is /tmp/tailscaled.sock with a symlink here, and a symlink is useless
      # across containers). tailnet-status reads peer state through it.
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    ports:
      # Must also be forwarded on the home router (UDP 41642 -> this host).
      - "41642:41642/udp"
    volumes:
      # Node identity. Without a persistent state dir the container registers as
      # a NEW node on every recreate, and the old one lingers holding the
      # hostname — which is how you end up with homelab-1, -2, -3.
      - ./state:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      # Subnet routing forwards packets between interfaces. Set explicitly rather
      # than inherited — /proc/sys is read-only in the container, so containerboot
      # cannot turn this on itself.
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:41234/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "autoheal=true"
      - "homepage.group=Network"
      - "homepage.name=Tailscale"
      - "homepage.icon=tailscale.png"
      - "homepage.description=Tailnet subnet router for the Docker network"
      # Lists the other machines on the tailnet with Online/Offline, from the
      # tailnet-status sidecar below. dynamic-list renders one row per item.
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://tailnet-status:8080/"
      - "homepage.widget.refreshInterval=30000"
      - "homepage.widget.display=dynamic-list"
      - "homepage.widget.mappings.name=name"
      - "homepage.widget.mappings.label=status"
      - "homepage.widget.mappings.limit=10"
    networks:
      - traefik-public
    restart: unless-stopped

  # Serves the tailnet's machine list (name + Online/Offline) for the card
  # above by asking tailscaled over its LocalAPI socket. No API key needed:
  # the node already knows its peers. Stdlib-only script, stock image.
  tailnet-status:
    image: python:3.13-alpine
    container_name: tailnet-status
    command: ["python", "/app/tailnet-status.py"]
    volumes:
      - ./scripts/tailnet-status.py:/app/tailnet-status.py:ro
      # Not :ro — connect(2) on a unix socket needs write permission on it.
      - tailscale-sock:/var/run/tailscale
    depends_on:
      - tailscale
    networks:
      # Only Homepage talks to it, and Homepage is on traefik-public.
      - traefik-public
    restart: unless-stopped

volumes:
  # tailscaled's LocalAPI socket, shared with tailnet-status.
  tailscale-sock:

networks:
  traefik-public:
    external: true
