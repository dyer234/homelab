
networks:
  media_net:
    driver: bridge
  traefik-public:
    external: true

volumes:
  # Generated pages + cached posters for media-posters.
  media-posters:

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "homepage.group=Find New"
      - "homepage.name=Prowlarr"
      - "homepage.icon=prowlarr.png"
      - "homepage.href=https://prowlarr.${DOMAIN}"
      - "homepage.description=Indexer Manager"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${MEDIA_HOST}:${MEDIA_CONTAINER}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "homepage.group=Find New"
      - "homepage.name=Sonarr"
      - "homepage.icon=sonarr.png"
      - "homepage.href=https://sonarr.${DOMAIN}"
      - "homepage.description=TV Shows"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${MEDIA_HOST}:${MEDIA_CONTAINER}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "homepage.group=Find New"
      - "homepage.name=Radarr"
      - "homepage.icon=radarr.png"
      - "homepage.href=https://radarr.${DOMAIN}"
      - "homepage.description=Movies"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  emby:
    image: lscr.io/linuxserver/emby:latest
    container_name: emby
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/emby:/config
      - ${MEDIA_HOST}:${MEDIA_CONTAINER}
    ports:
      - "8096:8096"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.emby.rule=Host(`emby.${DOMAIN}`)"
      - "traefik.http.routers.emby.entrypoints=websecure"
      - "traefik.http.services.emby.loadbalancer.server.port=8096"
      - "homepage.group=Media"
      - "homepage.name=Emby"
      - "homepage.icon=emby.png"
      - "homepage.href=https://emby.${DOMAIN}"
      - "homepage.description=Media Server"
      - "homepage.widget.type=emby"
      - "homepage.widget.url=http://emby:8096"
      - "homepage.widget.key=${EMBY_API_KEY}"
      - "homepage.widget.enableBlocks=true"
      - "homepage.widget.enableNowPlaying=true"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    labels:
      # qBittorrent routes through gluetun's network, so the Traefik labels
      # for qbit go HERE (Traefik needs the container that owns the IP). The
      # homepage.* labels for qbit live on the qbittorrent service instead:
      # Homepage reads labels through the Docker socket, not the network, and
      # it allows one card per container — this container's card is the VPN.
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8181"
      # Dashboard card for the tunnel itself. Two widgets:
      #   [0] Homepage's native gluetun widget hits the control server for the
      #       exit's public IP / region / country. It only succeeds when the
      #       tunnel is actually passing traffic, so a populated IP IS the
      #       health signal; a failing tunnel shows an API error instead.
      #       (Route access is granted in gluetun/auth/config.toml.)
      #   [1] Restart counts from the gluetun-stats sidecar below, because a
      #       tunnel that reconnects every 11 seconds looks "up" to [0].
      - "homepage.group=Network"
      - "homepage.name=VPN (Gluetun)"
      - "homepage.icon=gluetun.png"
      - "homepage.description=ProtonVPN WireGuard tunnel for qBittorrent"
      - "homepage.widgets[0].type=gluetun"
      - "homepage.widgets[0].url=http://gluetun:8000"
      - "homepage.widgets[0].version=2"
      - "homepage.widgets[1].type=customapi"
      - "homepage.widgets[1].url=http://gluetun-stats:8080/"
      - "homepage.widgets[1].refreshInterval=60000"
      - "homepage.widgets[1].mappings[0].field=restarts_1h"
      - "homepage.widgets[1].mappings[0].label=Restarts (1h)"
      - "homepage.widgets[1].mappings[0].format=number"
      - "homepage.widgets[1].mappings[1].field=restarts_24h"
      - "homepage.widgets[1].mappings[1].label=Restarts (24h)"
      - "homepage.widgets[1].mappings[1].format=number"
      - "homepage.widgets[1].mappings[2].field=last_restart"
      - "homepage.widgets[1].mappings[2].label=Last restart"
      - "homepage.widgets[1].mappings[2].format=text"
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${PROTONVPN_SERVER_COUNTRIES:-United States}
      # The firewall (and with it the kill switch) is ON — that is gluetun's
      # default and it is what we want. `FIREWALL=off` used to sit here and did
      # nothing: gluetun renamed the toggle to
      # FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT and ignores the
      # old name, so the line only ever misled anyone reading this file.
      # Opens 6881 on the VPN interface for torrent peers:
      - FIREWALL_VPN_INPUT_PORTS=6881
      # Opens 8181 on the Docker interfaces so Traefik and Sonarr can reach the
      # qBittorrent WebUI. Without it Sonarr fails with
      # "Download client failed to add torrent by url".
      - FIREWALL_INPUT_PORTS=8181,8888
      # HTTP proxy on 8888 (Docker interfaces only, never published). Prowlarr
      # uses it as an Indexer Proxy for sites the ISP blocks by SNI (Cloudflare-
      # fronted trackers get a TCP reset right after the TLS Client Hello; the
      # same request through the tunnel works). Settings > Indexers > Indexer
      # Proxies in Prowlarr: HTTP, host gluetun, port 8888, tagged "vpn".
      - HTTPPROXY=on
      - TZ=${TZ}
    ports:
      - "8181:8181/tcp"
      - "6882:6881/tcp"
      - "6882:6881/udp"
    volumes:
      # Control-server roles; see the file for why the routes are auth-less.
      - ./gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    # gluetun's own healthcheck: asks its internal health server (127.0.0.1:9999)
    # whether the last TCP dial *through the tunnel* succeeded — i.e. exactly
    # "is the VPN passing traffic". Homepage shows it as the card's status pill.
    #
    # INFORMATIONAL ONLY. Nothing may act on it: no autoheal label here and no
    # `condition: service_healthy` on qbittorrent. Both existed once (see commit
    # 7b16f7f) and recreating gluetun leaves qbittorrent, which shares its
    # network namespace, permanently without a network until it is recreated
    # too. That trap is why the healthcheck was disabled outright rather than
    # just detached; detached is enough.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  # Counts "restarting VPN" lines in gluetun's log over the last 1h / 24h for
  # the VPN card's second widget. Read-only Docker socket; stdlib-only script.
  gluetun-stats:
    image: python:3.13-alpine
    container_name: gluetun-stats
    command: ["python", "/app/gluetun-stats.py"]
    environment:
      - GLUETUN_CONTAINER=gluetun
    volumes:
      - ./scripts/gluetun-stats.py:/app/gluetun-stats.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Only Homepage talks to it, and Homepage is on traefik-public.
      - traefik-public
    restart: unless-stopped

  # Poster rows for the dashboard's "Coming Soon" / "Recently Downloaded"
  # cards: Sonarr + Radarr calendar and import history rendered to static
  # pages, embedded by Homepage's iframe widget (homepage/config/services.yaml).
  # The browser loads the iframe, not Homepage, hence the Traefik route.
  # API keys come from the apps' own config.xml (read-only mounts).
  media-posters:
    image: python:3.13-alpine
    container_name: media-posters
    command: ["python", "/app/media-posters.py"]
    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      - EMBY_API_KEY=${EMBY_API_KEY}
      - REFRESH_SECONDS=3600
    volumes:
      - ./scripts/media-posters.py:/app/media-posters.py:ro
      - ./config/sonarr:/arr/sonarr:ro
      - ./config/radarr:/arr/radarr:ro
      - media-posters:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.media-posters.rule=Host(`posters.${DOMAIN}`)"
      - "traefik.http.routers.media-posters.entrypoints=websecure"
      - "traefik.http.services.media-posters.loadbalancer.server.port=8080"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      - "autoheal=true"
      # Dashboard card. Traefik labels for this service are on gluetun (see
      # there); these can live here because Homepage discovers via the Docker
      # socket, and this way the card's status pill is qbittorrent's own.
      - "homepage.group=Downloads"
      - "homepage.name=qBittorrent"
      - "homepage.icon=qbittorrent.png"
      - "homepage.href=https://qbit.${DOMAIN}"
      - "homepage.description=Torrent Client"
      - "homepage.widget.type=qbittorrent"
      - "homepage.widget.url=http://gluetun:8181"
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8181
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_HOST}:${MEDIA_CONTAINER}
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_HOST}:${MEDIA_CONTAINER}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "homepage.group=Find New"
      - "homepage.name=Bazarr"
      - "homepage.icon=bazarr.png"
      - "homepage.href=https://bazarr.${DOMAIN}"
      - "homepage.description=Subtitles"
    networks:
      - media_net
      - traefik-public
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - media_net
    restart: unless-stopped
