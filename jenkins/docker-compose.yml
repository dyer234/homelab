services:
  jenkins:
    build: .
    pull_policy: build
    container_name: jenkins
    ports:
      # JNLP port for inbound agents on the LAN. Cloud agents do NOT use this —
      # they reach both 8080 and 50000 on the container IP below, via the
      # subnet router in ../tailscale. Deliberately not publishing 8080 on the
      # host: it would add LAN exposure without buying the agents anything.
      - "50000:50000"
    volumes:
      - ./data:/var/jenkins_home
      - jenkins_root:/root
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.${DOMAIN}`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
      - "homepage.group=Automation"
      - "homepage.name=Jenkins"
      - "homepage.icon=jenkins.png"
      - "homepage.href=https://jenkins.${DOMAIN}"
      - "homepage.description=CI/CD Server"
    networks:
      traefik-public:
        # Static, because the build agents target this address by value. Docker
        # hands out dynamic IPs from the bottom of the /16, so a high address
        # will not be allocated out from under us. NET_PREFIX is the subnet
        # home-traefik pins on traefik-public; infra/ci-agent's jenkins_url
        # must match the server's value.
        ipv4_address: ${NET_PREFIX}.255.10
    restart: unless-stopped

  # Serves the agent list (name + online/idle) for the CI Agents card on
  # Homepage by asking the controller's API. Agents are created by
  # infra/ci-agent, so the card follows TF_VAR_agent_count automatically.
  # Stdlib-only script, stock image; same pattern as tailscale/scripts.
  jenkins-agents:
    image: python:3.13-alpine
    container_name: jenkins-agents
    command: ["python", "/app/agents-status.py"]
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_API_USER=${JENKINS_API_USER}
      - JENKINS_API_TOKEN=${JENKINS_API_TOKEN}
    volumes:
      - ./scripts/agents-status.py:/app/agents-status.py:ro
    depends_on:
      - jenkins
    labels:
      - "homepage.group=Automation"
      - "homepage.name=CI Agents"
      - "homepage.icon=digital-ocean.png"
      - "homepage.href=https://jenkins.${DOMAIN}/computer/"
      - "homepage.description=Cloud build agents (infra/ci-agent), over Tailscale"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://jenkins-agents:8080/"
      - "homepage.widget.refreshInterval=30000"
      - "homepage.widget.display=dynamic-list"
      - "homepage.widget.mappings.name=name"
      - "homepage.widget.mappings.label=status"
      - "homepage.widget.mappings.limit=10"
    networks:
      - traefik-public
    restart: unless-stopped

networks:
  traefik-public:
    external: true

volumes:
  jenkins_root: